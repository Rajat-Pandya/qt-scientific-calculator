name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev build-essential

      - name: Build application
        run: |
          qmake6 Calculator.pro
          make

      - name: Build and run tests
        run: |
          cd tests
          qmake6 tests.pro
          make
          ./tst_expressionparser
